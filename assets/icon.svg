<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">MoniRondo – monitor swap</title>
  <desc id="desc">Minimalist app icon: white monitor with two circular arrows on a teal background.</desc>

  <!-- Flat, exact brand color; transparent pixels outside the rounded tile. -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="#009983"/>

  <!-- Two clockwise arcs form a circular exchange symbol. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="27" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 108 198 C 131 124 190 96 256 96 C 330 96 383 130 400 185"/>
    <path d="M 404 319 C 380 388 322 417 256 417 C 181 417 128 383 112 327"/>
  </g>

  <!-- The heads are deliberately large enough to survive downscaling. -->
  <g fill="#FFFFFF">
    <path d="M 408 209 L 371 174 Q 367 170 374 169 L 414 157 Q 419 155 418 162 L 418 205 Q 418 213 408 209 Z"/>
    <path d="M 105 302 L 143 337 Q 147 341 140 343 L 98 355 Q 93 357 94 350 L 94 307 Q 94 299 105 302 Z"/>
  </g>

  <!-- One simple monitor, no window detail. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="27" stroke-linecap="round" stroke-linejoin="round">
    <rect x="174" y="197" width="164" height="112" rx="10"/>
    <path d="M 256 313 V 353 M 218 353 H 294"/>
  </g>
</svg>
